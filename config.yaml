meta:
  engine: 4.1.0
  name: kabuki
  version: 1.0

units:
  # Ergogen's default key pitch is u (19 mm); MX is U (19.05 mm)
  $default_spread: U
  $default_padding: U
  margin: 2
  curve_r: 10
  corner_r: 3
  xiao_h: 21
  xiao_gap: 2
  # XIAO centre, from the pinky home key
  xiao_y: U / 2 + xiao_gap + xiao_h / 2

points:
  zones:
    fingers:
      # moves the boards onto KiCad's sheet
      anchor.shift: [100, -100]
      key:
        tags: [key]
      columns:
        # 4 x 4 matrix: ring, middle, index and inner are the columns;
        # the pinky keys join the thumbs on row R3
        pinky:
          rows:
            top.skip: true
            home: {column_net: C0, row_net: R3}
            bottom: {column_net: C1, row_net: R3}
        ring:
          key.stagger: 0.55U
          key.column_net: C0
        middle:
          key.stagger: 0.45U
          key.column_net: C1
        index:
          key.stagger: -0.35U
          key.column_net: C2
        inner:
          key.stagger: -0.15U
          key.column_net: C3
          rows.bottom.tags: [encoder]
      rows:
        bottom.row_net: R2
        home.row_net: R1
        top.row_net: R0
    thumbs:
      anchor:
        ref: fingers_index_bottom
        # 3 mm row gap, as in v0's fit-tested thumb row
        shift: [0, -U - 3]
        rotate: -8
      key:
        tags: [key]
        row_net: R3
      columns:
        near:
          key.column_net: C2
        far:
          key:
            column_net: C3
            splay: -12
            # pivot on the bottom-left corner so the two caps fan from their bottom edges
            origin: [-0.5U, -0.5U]
            # 1.5u cap, long side vertical: dropped 0.25U so its top edge stays
            # where a 1u cap's would be, clear of the knob
            height: 1.5U
            shift: [0, -0.25U]
      rows:
        thumb:
  mirror:
    ref: fingers_inner_home
    distance: 70

outlines:
  # a cell per key plus the XIAO area, grown by curve_r with round joints...
  left_raw:
    - what: rectangle
      where: [[meta.mirrored ~ false]]
      size: [U + 2 * margin, U + 2 * margin]
    - what: rectangle
      where: thumbs_far_thumb
      size: [U + 2 * margin, 1.5U + 2 * margin]
    - what: rectangle
      where: fingers_pinky_home
      adjust.shift: [0, U / 2 + (xiao_gap + xiao_h) / 2]
      size: [U + 2 * margin, xiao_gap + xiao_h]
      expand: curve_r
      joints: 0
  # ...then shrunk back by curve_r (rounds inside corners) and corner_r more, then grown
  # by corner_r (rounds outside corners). Ergogen's fillet missed a thumb corner on one half
  _left_shrunk:
    - what: outline
      name: left_raw
      expand: -(curve_r + corner_r)
      joints: 0
  left_board:
    - what: outline
      name: _left_shrunk
      expand: corner_r
      joints: 0
  right_raw:
    - what: rectangle
      where: [[meta.mirrored ~ true]]
      size: [U + 2 * margin, U + 2 * margin]
    - what: rectangle
      where: mirror_thumbs_far_thumb
      size: [U + 2 * margin, 1.5U + 2 * margin]
    - what: rectangle
      where: mirror_fingers_pinky_home
      adjust.shift: [0, U / 2 + (xiao_gap + xiao_h) / 2]
      size: [U + 2 * margin, xiao_gap + xiao_h]
      expand: curve_r
      joints: 0
  _right_shrunk:
    - what: outline
      name: right_raw
      expand: -(curve_r + corner_r)
      joints: 0
  right_board:
    - what: outline
      name: _right_shrunk
      expand: corner_r
      joints: 0
  # EEMB LP603449 (max 34.5 x 51 mm) under the middle and index columns, clear of the encoder pins
  left_battery:
    - what: rectangle
      where:
        aggregate.parts: [fingers_middle_home, fingers_index_home]
      size: [34.5, 51]
  right_battery:
    - what: rectangle
      where:
        aggregate.parts: [mirror_fingers_middle_home, mirror_fingers_index_home]
      size: [34.5, 51]

pcbs:
  left:
    template: kicad8
    outlines:
      edge:
        outline: left_board
      battery:
        outline: left_battery
        layer: B.SilkS
    footprints:
      switch:
        what: ceoloide/switch_mx
        where: [[key, meta.mirrored ~ false]]
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: ceoloide/diode_tht_sod123
        where: [[meta.mirrored ~ false]]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust.shift: [0, -5]
      encoder:
        what: ceoloide/rotary_encoder_ec11_ec12
        where: [[encoder, meta.mirrored ~ false]]
        params:
          S1: "{{column_net}}"
          S2: "{{colrow}}"
          A: ENC_A
          C: ENC_B
      mcu:
        what: imstubtw/xiao-ble
        where:
          ref: fingers_pinky_home
          shift: [0, xiao_y]
        params:
          side: B
          BAT_POS: BAT_SW
          # the XIAO ties its BAT- pad to GND internally, so this pad needs no track
          BAT_NEG: XIAO_BAT_N
          # D0-D6 face the keys; the outer side (D8-D10) takes the nets with keys right below
          # the XIAO (pinky). D7 is left free: it sits against the antenna keep-out
          P0: R0
          P1: R1
          P2: C2
          P3: C3
          P4: ENC_A
          P5: ENC_B
          P6: R2
          P8: R3
          P9: C1
          P10: C0
      jst:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: fingers_ring_bottom
          shift: [5.45, -6.28]
          rotate: 90
        params:
          side: B
      power:
        what: ceoloide/power_switch_smd_side
        where:
          ref: fingers_pinky_bottom
          shift: [-(U / 2 + margin) + 3.1, U / 2 - 0.5]
          # lever out of the outer edge
          rotate: 180
        params:
          side: B
          include_courtyard: true
          from: BAT_P
          to: BAT_SW
      # M2 holes: clear of the plate cutouts (2.5 mm), back-side parts and the battery
      # (3 mm, for a 5.5 mm case post) and the board edge (3 mm), on both halves
      hole_top_outer:
        what: ceoloide/mounting_hole_npth
        where: {ref: fingers_ring_top, shift: [6.17, 10.59]}
      hole_top_inner:
        what: ceoloide/mounting_hole_npth
        where: {ref: fingers_inner_top, shift: [-7.23, 10.05]}
      hole_bottom_inner:
        what: ceoloide/mounting_hole_npth
        where: {ref: fingers_inner_bottom, shift: [9.52, -16.11]}
      hole_bottom_outer:
        what: ceoloide/mounting_hole_npth
        where: {ref: fingers_pinky_bottom, shift: [12.22, -0.83]}
      # back silkscreen, beside the battery outline toward the inner column
      credit:
        what: ceoloide/utility_text
        where:
          aggregate.parts: [fingers_middle_home, fingers_index_home]
          shift: [19.85, -25.5]
          rotate: 90
        params:
          side: B
          mirrored: true
          text: kabuki by argenthand
          height: 2
          width: 2
          thickness: 0.3
  right:
    template: kicad8
    outlines:
      edge:
        outline: right_board
      battery:
        outline: right_battery
        layer: B.SilkS
    footprints:
      switch:
        what: ceoloide/switch_mx
        where: [[key, meta.mirrored ~ true]]
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: ceoloide/diode_tht_sod123
        where: [[meta.mirrored ~ true]]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust.shift: [0, -5]
      encoder:
        what: ceoloide/rotary_encoder_ec11_ec12
        where: [[encoder, meta.mirrored ~ true]]
        params:
          S1: "{{column_net}}"
          S2: "{{colrow}}"
          A: ENC_A
          C: ENC_B
      mcu:
        what: imstubtw/xiao-ble
        where:
          ref: mirror_fingers_pinky_home
          shift: [0, xiao_y]
        params:
          side: B
          BAT_POS: BAT_SW
          # the XIAO ties its BAT- pad to GND internally, so this pad needs no track
          BAT_NEG: XIAO_BAT_N
          # the footprint isn't mirrored, so on this half only D7-D10 face the keys:
          # they take the nets that go furthest in (encoder, index and inner columns)
          P0: R0
          P1: R1
          P2: R2
          P3: C0
          P4: C1
          P5: R3
          P7: ENC_B
          P8: ENC_A
          P9: C2
          P10: C3
      jst:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: mirror_fingers_ring_bottom
          shift: [5.45, -6.28]
          rotate: 90
        params:
          side: B
      power:
        what: ceoloide/power_switch_smd_side
        where:
          ref: mirror_fingers_pinky_bottom
          # 2.7 mm higher than the left: the unmirrored socket of the key below reaches the edge here
          shift: [-(U / 2 + margin) + 3.1, U / 2 + 2.2]
          # footprints aren't mirrored, so no rotation keeps this lever on the outer edge
        params:
          side: B
          include_courtyard: true
          from: BAT_P
          to: BAT_SW
      # M2 holes: clear of the plate cutouts (2.5 mm), back-side parts and the battery
      # (3 mm, for a 5.5 mm case post) and the board edge (3 mm), on both halves
      hole_top_outer:
        what: ceoloide/mounting_hole_npth
        where: {ref: mirror_fingers_ring_top, shift: [6.17, 10.59]}
      hole_top_inner:
        what: ceoloide/mounting_hole_npth
        where: {ref: mirror_fingers_inner_top, shift: [-7.23, 10.05]}
      hole_bottom_inner:
        what: ceoloide/mounting_hole_npth
        where: {ref: mirror_fingers_inner_bottom, shift: [9.52, -16.11]}
      hole_bottom_outer:
        what: ceoloide/mounting_hole_npth
        where: {ref: mirror_fingers_pinky_bottom, shift: [12.22, -0.83]}
      # back silkscreen, hidden under the battery
      message:
        what: ceoloide/utility_text
        where:
          aggregate.parts: [mirror_fingers_middle_home, mirror_fingers_index_home]
          shift: [6.1, -5.6]
        params:
          side: B
          mirrored: true
          text: kaizen
          height: 3
          width: 3
          thickness: 0.45
